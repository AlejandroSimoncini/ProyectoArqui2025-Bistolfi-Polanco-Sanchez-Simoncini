version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: Clifito25!
      MYSQL_DATABASE: proyectoarquisoft
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: go_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_USER=root
      - DB_PASSWORD=Clifito25!
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=proyectoarquisoft
    ports:
      - "80:80"

  frontend:
    build: ./frontend
    container_name: react_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
